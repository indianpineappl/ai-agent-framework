<?xml version="1.0" encoding="UTF-8"?>

<svg width="1200" height="900" viewBox="0 0 1200 900"
     xmlns="http://www.w3.org/2000/svg">

<defs>
<style><![CDATA[
.heading{
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Helvetica,sans-serif;
font-size:22px;
font-weight:600;
fill:#1D1D1F;
}
.sub{
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,sans-serif;
font-size:15px;
fill:#6E6E73;
}
.node{
fill:white;
stroke:#D2D2D7;
stroke-width:2;
}
.line{
stroke:#D2D2D7;
stroke-width:2;
fill:none;
stroke-linecap:round;
}
.blue{
fill:#0071E3;
}
]]></style>

<marker id="arrow"
markerWidth="8"
markerHeight="8"
refX="6"
refY="3"
orient="auto">
<path d="M0,0 L6,3 L0,6"
fill="#D2D2D7"/>
</marker>
</defs>

<!-- Outer loop -->
<path class="line"
d="M600 170
C820 170 980 330 980 450
C980 620 820 730 600 730
C380 730 220 620 220 450
C220 330 380 170 600 170"
marker-end="url(#arrow)"/>

<!-- Observe -->
<circle cx="600" cy="170" r="58" class="node"/>
<text x="600" y="166"
text-anchor="middle"
class="heading">
Observe
</text>
<text x="600" y="188"
text-anchor="middle"
class="sub">
Understand the task
</text>

<!-- Reason -->
<circle cx="875" cy="315" r="58" class="node"/>
<text x="875" y="311"
text-anchor="middle"
class="heading">
Reason
</text>
<text x="875" y="333"
text-anchor="middle"
class="sub">
Plan next step
</text>

<!-- Select -->
<circle cx="875" cy="585" r="58" class="node"/>
<text x="875" y="581"
text-anchor="middle"
class="heading">
Select
</text>
<text x="875" y="603"
text-anchor="middle"
class="sub">
Choose capability
</text>

<!-- Execute -->
<circle cx="600" cy="730" r="58" class="node"/>
<text x="600" y="726"
text-anchor="middle"
class="heading">
Execute
</text>
<text x="600" y="748"
text-anchor="middle"
class="sub">
Perform action
</text>

<!-- Verify -->
<circle cx="325" cy="585" r="58" class="node"/>
<text x="325" y="581"
text-anchor="middle"
class="heading">
Verify
</text>
<text x="325" y="603"
text-anchor="middle"
class="sub">
Check outcome
</text>

<!-- Runtime Context -->
<circle cx="325" cy="315" r="72" class="node"/>
<text x="325" y="305"
text-anchor="middle"
class="heading">
Update
</text>
<text x="325" y="330"
text-anchor="middle"
class="heading">
Runtime Context
</text>

<circle cx="600" cy="450" r="8" class="blue"/>

</svg>
