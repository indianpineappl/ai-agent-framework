<?xml version="1.0" encoding="UTF-8"?>

<svg width="1200" height="900" viewBox="0 0 1200 900"
xmlns="http://www.w3.org/2000/svg">

<defs>
<style><![CDATA[
.title{
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Helvetica,sans-serif;
font-size:30px;
font-weight:600;
fill:#1D1D1F;
}
.heading{
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Helvetica,sans-serif;
font-size:20px;
font-weight:600;
fill:#1D1D1F;
}
.body{
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,sans-serif;
font-size:16px;
fill:#6E6E73;
}
.small{
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,sans-serif;
font-size:14px;
fill:#6E6E73;
}
.box{
fill:#FFFFFF;
stroke:#D2D2D7;
stroke-width:1.5;
rx:22;
}
.goal{
fill:#F2F8FF;
stroke:#0071E3;
stroke-width:2;
rx:22;
}
.agent{
fill:#0071E3;
}
.line{
stroke:#D2D2D7;
stroke-width:2;
fill:none;
stroke-linecap:round;
}
]]></style>

<marker id="arrow"
markerWidth="9"
markerHeight="9"
refX="7"
refY="4.5"
orient="auto">
<path d="M0,0 L8,4.5 L0,9"
fill="#B5B5BA"/>
</marker>
</defs>

<!-- TITLE -->
<text
x="600"
y="55"
