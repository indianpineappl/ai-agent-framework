<?xml version="1.0" encoding="UTF-8"?>

<svg width="1200" height="950" viewBox="0 0 1200 950"
     xmlns="http://www.w3.org/2000/svg">

<defs>
<style><![CDATA[
.heading{
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Helvetica,sans-serif;
font-size:21px;
font-weight:600;
fill:#1D1D1F;
}
.sub{
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,sans-serif;
font-size:15px;
fill:#6E6E73;
}
.box{
fill:white;
stroke:#D2D2D7;
stroke-width:2;
rx:22;
}
.line{
stroke:#D2D2D7;
stroke-width:2;
stroke-linecap:round;
fill:none;
}
.blue{
fill:#0071E3;
}
]]></style>

<marker id="arrow"
markerWidth="8"
markerHeight="8"
refX="6"
refY="3"
orient="auto">
<path d="M0,0 L6,3 L0,6"
fill="#D2D2D7"/>
</marker>
</defs>

<!-- User Goal -->
<rect x="320" y="60"
width="560"
height="90"
rx="20"
class="box"/>

<text x="600"
y="98"
text-anchor="middle"
class="heading">
User Goal
</text>

<text x="600"
y="122"
text-anchor="middle"
class="sub">
"Analyse last week's user retention and email me the findings."
</text>

<!-- Arrow -->
<line class="line"
x1="600"
y1="150"
x2="600"
y2="215"
marker-end="url(#arrow)"/>

<!-- Framework -->
<rect x="220"
y="220"
width="760"
height="410"
rx="28"
class="box"/>

<text x="600"
y="260"
text-anchor="middle"
class="heading">
The Practical AI Agent Framework
</text>

<!-- Four Pillars -->
<circle cx="390" cy="360" r="52" class="box"/>
<text x="390"
y="365"
text-anchor="middle"
class="heading">
Identity
</text>

<circle cx="810" cy="360" r="52" class="box"/>
<text x="810"
y="365"
text-anchor="middle"
class="heading">
Knowledge
</text>

<circle cx="390" cy="510" r="52" class="box"/>
<text x="390"
y="515"
text-anchor="middle"
class="heading">
Capabilities
</text>

<circle cx="810" cy="510" r="52" class="box"/>
<text x="810"
y="515"
text-anchor="middle"
class="heading">
Execution
</text>

<!-- Centre -->
<circle cx="600"
cy="435"
r="58"
fill="#0071E3"/>

<text x="600"
y="442"
text-anchor="middle"
font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif"
font-size="20"
font-weight="600"
fill="white">
Agent
</text>

<!-- Connecting lines -->
<line class="line" x1="442" y1="360" x2="542" y2="415"/>
<line class="line" x1="758" y1="360" x2="658" y2="415"/>
<line class="line" x1="442" y1="510" x2="542" y2="455"/>
<line class="line" x1="758" y1="510" x2="658" y2="455"/>

<!-- Arrow -->
<line class="line"
x1="600"
y1="630"
x2="600"
y2="700"
marker-end="url(#arrow)"/>

<!-- Outcome -->
<rect x="320"
y="720"
width="560"
height="120"
rx="22"
class="box"/>

<text x="600"
y="760"
text-anchor="middle"
class="heading">
Completed Outcome
</text>

<text x="600"
y="790"
text-anchor="middle"
class="sub">
Query executed • Analysis completed • Report generated • Email sent
</text>

</svg>
